name: Deploy Zypher to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'zypher-app/package-lock.json'
          
      - name: Install & Build Frontend
        working-directory: ./zypher-app
        run: |
          # Create lockfile if missing
          [ -f package-lock.json ] || npm i --package-lock-only
          npm ci --prefer-offline
          npm run build
        
      - name: Trigger Render Deployment
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.FRONTEND_SERVICE_ID }}/deploys"
          echo "Frontend deployment initiated"

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'zypher-scan-api/requirements.txt'
          
      - name: Install Dependencies
        working-directory: ./zypher-scan-api
        run: |
          # Create requirements if missing
          [ -f requirements.txt ] || pip freeze > requirements.txt
          pip install -r requirements.txt
          
      - name: Test MongoDB Connection
        run: |
          python .github/scripts/test_mongodb.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        
      - name: Trigger Render Deployment
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.BACKEND_SERVICE_ID }}/deploys"
          echo "Backend deployment initiated"
