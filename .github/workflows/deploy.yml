name: Deploy Zypher to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'zypher-app/package-lock.json'  # Explicit lockfile path
          
      - name: Install frontend dependencies
        working-directory: ./zypher-app
        run: |
          # Create lockfile if missing
          if [ ! -f package-lock.json ]; then
            npm i --package-lock-only
          fi
          npm ci --prefer-offline
          
      - name: Build frontend
        working-directory: ./zypher-app
        run: npm run build
        
      - name: Trigger Render deployment
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.FRONTEND_SERVICE_ID }}/deploys"
          echo "Frontend deployment triggered successfully"

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'zypher-scan-api/requirements.txt'  # Explicit dependency file
          
      - name: Install backend dependencies
        working-directory: ./zypher-scan-api
        run: |
          # Ensure requirements.txt exists
          if [ ! -f requirements.txt ]; then
            echo "Creating requirements.txt"
            pip freeze > requirements.txt
          fi
          pip install -r requirements.txt
          
      - name: Test MongoDB connection
        working-directory: ./.github/scripts
        run: |
          pip install -r requirements.txt
          python test_mongodb.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        
      - name: Trigger Render deployment
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.BACKEND_SERVICE_ID }}/deploys"
          echo "Backend deployment triggered successfully"
