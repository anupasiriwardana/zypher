name: Deploy Zypher to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RENDER_API: https://api.render.com/v1

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    outputs:
      token-valid: ${{ steps.token-check.outputs.valid }}
      frontend-valid: ${{ steps.frontend-check.outputs.valid }}
      backend-valid: ${{ steps.backend-check.outputs.valid }}
    steps:
      - name: Verify Render token
        id: token-check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_TOKEN }}" \
            ${{ env.RENDER_API }}/services)
          
          if [ "$response" = "200" ]; then
            echo "✅ Render token is valid"
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Invalid Render token (HTTP $response)"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify frontend service
        id: frontend-check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_TOKEN }}" \
            ${{ env.RENDER_API }}/services/${{ secrets.FRONTEND_SERVICE_ID }})
          
          if [ "$response" = "200" ]; then
            echo "✅ Frontend service exists"
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Invalid frontend service ID (HTTP $response)"
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify backend service
        id: backend-check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_TOKEN }}" \
            ${{ env.RENDER_API }}/services/${{ secrets.BACKEND_SERVICE_ID }})
          
          if [ "$response" = "200" ]; then
            echo "✅ Backend service exists"
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Invalid backend service ID (HTTP $response)"
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

  deploy-frontend:
    needs: verify-secrets
    if: ${{ needs.verify-secrets.outputs.token-valid == 'true' && needs.verify-secrets.outputs.frontend-valid == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install frontend dependencies
        working-directory: ./zypher-app
        run: npm ci --prefer-offline
        
      - name: Build frontend
        working-directory: ./zypher-app
        run: npm run build
        
      - name: Trigger Render deployment
        run: |
          echo "Triggering frontend deployment..."
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ env.RENDER_API }}/services/${{ secrets.FRONTEND_SERVICE_ID }}/deploys"
          
          echo -e "\n✅ Deployment triggered successfully"
          echo "Monitor progress at: https://dashboard.render.com/web/${{ secrets.FRONTEND_SERVICE_ID }}"

  deploy-backend:
    needs: verify-secrets
    if: ${{ needs.verify-secrets.outputs.token-valid == 'true' && needs.verify-secrets.outputs.backend-valid == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install backend dependencies
        working-directory: ./zypher-scan-api
        run: pip install -r requirements.txt
        
      - name: Test MongoDB connection
        working-directory: ./.github/scripts
        run: |
          pip install -r requirements.txt
          python test_mongodb.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        
      - name: Trigger Render deployment
        run: |
          echo "Triggering backend deployment..."
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ env.RENDER_API }}/services/${{ secrets.BACKEND_SERVICE_ID }}/deploys"
          
          echo -e "\n✅ Deployment triggered successfully"
          echo "Monitor progress at: https://dashboard.render.com/web/${{ secrets.BACKEND_SERVICE_ID }}"
