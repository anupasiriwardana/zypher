name: Deploy Zypher to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FRONTEND_DIR: zypher-app
  BACKEND_DIR: zypher-scan-api

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --prefer-offline
        
      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build
        
      - name: Deploy to Render (Frontend)
        uses: docker://render-actions/render-deploy@v1
        with:
          render-token: ${{ secrets.RENDER_TOKEN }}
          service-id: ${{ secrets.FRONTEND_SERVICE_ID }}
          directory: ${{ env.FRONTEND_DIR }}

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: pip install -r requirements.txt
        
      - name: Deploy to Render (Backend)
        uses: docker://render-actions/render-deploy@v1
        with:
          render-token: ${{ secrets.RENDER_TOKEN }}
          service-id: ${{ secrets.BACKEND_SERVICE_ID }}
          directory: ${{ env.BACKEND_DIR }}